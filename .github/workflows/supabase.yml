# Push pending migrations to the linked Supabase project.
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  — personal access token (Project Settings / API Keys: Read)
#   SUPABASE_PROJECT_ID    — project ref (e.g. suydavdxrvcajxfyowfj)
#   SUPABASE_DB_PASSWORD   — database password for that project

name: Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push --yes

      - name: List migrations
        run: supabase migration list --linked
